<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
</head>
<body>
    <div class="login-box">
        <h1>Login</h1>

        <form>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>
        </form>

        <p>Don't have an account? <a href="Registration.html" target="_blank">Sign Up Here</a></p>
    </div>
</body>
</html>
