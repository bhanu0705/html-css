<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="signup-box">
        <h1 class="center-text">Sign Up</h1>
        <p class="center-text">It's free and only takes a minute</p>

        <form class="signup-label">
            <div>
                <label for="fname">First Name</label>
                <input type="text" id="fname">
            </div>

            <div>
                <label for="lname">Last Name</label>
                <input type="text" id="lname">
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <div>
                <label for="cnfpassword">Confirm Password</label>
                <input type="password" id="cnfpassword">
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>

            <p class="center-text small-text">
                By clicking the Sign Up button, you agree to our 
                <a href="main.html" target="_blank">Terms and Conditions</a> and 
                <a href="main.html" target="_blank">Privacy Policy</a>.
            </p>

            <p class="center-text">Already have an account? 
                <a href="Login.html">Login Here</a>
            </p>
        </form>
    </div>
</body>
</html>
